<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer thin circle -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" />
  
  <!-- Film Aperture / Shutter Blades -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- 6 aperture blades meeting around a hexagonal center opening -->
    <path d="M 100 8 L 138 72 L 62 72 Z" fill="#FFFFFF" fill-opacity="0.12" />
    <line x1="100" y1="8" x2="138" y2="72" />
    <line x1="179.6" y1="54" x2="138" y2="128" />
    <line x1="179.6" y1="146" x2="100" y2="156" />
    <line x1="100" y1="192" x2="62" y2="128" />
    <line x1="20.4" y1="146" x2="62" y2="72" />
    <line x1="20.4" y1="54" x2="100" y2="44" />
  </g>
  
  <!-- Subtle center aperture opening -->
  <circle cx="100" cy="100" r="32" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.75" />
  <circle cx="100" cy="100" r="8" fill="#FFFFFF" opacity="0.9" />
  
  <!-- Film Sprocket marks on rim -->
  <circle cx="100" cy="14" r="2" fill="#FFFFFF" opacity="0.6" />
  <circle cx="186" cy="100" r="2" fill="#FFFFFF" opacity="0.6" />
  <circle cx="100" cy="186" r="2" fill="#FFFFFF" opacity="0.6" />
  <circle cx="14" cy="100" r="2" fill="#FFFFFF" opacity="0.6" />
</svg>
